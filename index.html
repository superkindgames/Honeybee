<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Honey Bee</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Honey Bee">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F5FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D111B" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="bee-180.png">
<link rel="icon" type="image/png" href="bee-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: one thumb-first column. Big category tiles, preset grids, one huge "Add now", and a fixed bottom bar (Home / Log) on every screen. */
:root{
  --bg:#F2F5FA; --card:#FFFFFF; --fg:#1A2133; --muted:#5F6A84; --line:#DCE2EE;
  --feed:#D63F78; --feed-soft:#FBE3EC;
  --diaper:#E09A0C; --diaper-soft:#FCF0D2; --diaper-on:#2A1C00;
  --nap:#6656D4; --nap-soft:#E8E5FA;
  --custom:#2A80CF; --custom-soft:#E0ECFA;
  --pump:#0B8F9C; --pump-soft:#DAF1F3;
  --skin:#F6C9A8; --skin2:#E9A97F; --onesie:#F5A9C6;
  --pick-bg:#F4EEFF; --pick-band:#FFFFFF; --pick-line:#F5A9C6; --pick-accent:#D63F78; --band-out:#F3ECFF; --band-in:#E3D6FB;
  --sel:#1E9F55; --sel-fg:#FFFFFF; --danger:#CF3F3F; --on-c:#FFFFFF;
  --font:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D111B; --card:#171E30; --fg:#EDF0F8; --muted:#9AA4BE; --line:#28324C;
  --feed:#F2709F; --feed-soft:#3A1828;
  --diaper:#F4B93A; --diaper-soft:#382A0C; --diaper-on:#231700;
  --nap:#9186F0; --nap-soft:#24213F;
  --custom:#5BA2EE; --custom-soft:#172A44;
  --pump:#3CC3CF; --pump-soft:#0F3238;
  --pick-bg:#211C38; --pick-band:#322A55; --pick-line:#F2709F; --pick-accent:#F2709F; --band-out:#221D3B; --band-in:#362D5C;
  --sel:#2DBE6C; --sel-fg:#04210E; --danger:#F06A6A; --on-c:#0B1020;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D111B; --card:#171E30; --fg:#EDF0F8; --muted:#9AA4BE; --line:#28324C;
  --feed:#F2709F; --feed-soft:#3A1828;
  --diaper:#F4B93A; --diaper-soft:#382A0C; --diaper-on:#231700;
  --nap:#9186F0; --nap-soft:#24213F;
  --custom:#5BA2EE; --custom-soft:#172A44;
  --pump:#3CC3CF; --pump-soft:#0F3238;
  --pick-bg:#211C38; --pick-band:#322A55; --pick-line:#F2709F; --pick-accent:#F2709F; --band-out:#221D3B; --band-in:#362D5C;
  --sel:#2DBE6C; --sel-fg:#04210E; --danger:#F06A6A; --on-c:#0B1020;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{color-scheme:light}
@media (prefers-color-scheme: dark){html{color-scheme:dark}}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;font-weight:700;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(14px,env(safe-area-inset-top,0px)) calc(104px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.c-feeding{--c:var(--feed);--cs:var(--feed-soft);--on:var(--on-c)}
.c-diaper{--c:var(--diaper);--cs:var(--diaper-soft);--on:var(--diaper-on)}
.c-nap{--c:var(--nap);--cs:var(--nap-soft);--on:var(--on-c)}
.c-custom{--c:var(--custom);--cs:var(--custom-soft);--on:var(--on-c)}
.c-pump{--c:var(--pump);--cs:var(--pump-soft);--on:var(--on-c)}
.grid.g4 .opt{font-size:19px}.grid.g5 .opt{font-size:17px;padding:4px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:24px;font-weight:900;letter-spacing:-.01em}
.me{padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:14px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me b{color:var(--fg)}
.note{padding:10px 14px;border-radius:14px;background:var(--card);border:1px dashed var(--line);color:var(--muted);font-size:14px}

.loglink{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:64px;padding:0 20px;border-radius:20px;
  background:var(--fg);color:var(--bg);font-size:20px;font-weight:900;letter-spacing:.06em}
.loglink small{font-size:14px;font-weight:700;letter-spacing:0;opacity:.75}
.tiles{display:flex;flex-direction:column;gap:12px}
.tiles .tile{transition:transform .18s ease;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tiles .tile.lifting{transition:none;position:relative;z-index:5;box-shadow:0 14px 32px rgba(0,0,0,.28);outline:3px solid var(--c)}
.tile{display:flex;align-items:center;gap:16px;width:100%;min-height:96px;padding:14px 18px;border-radius:24px;background:var(--cs);text-align:left}
.ic{flex:none;display:grid;place-items:center;width:60px;height:60px;border-radius:50%;background:var(--c);color:var(--on)}
.ic svg{width:32px;height:32px}
.tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tt b{font-size:24px;font-weight:900}
.tt small{font-size:15px;color:var(--muted);font-weight:700}
.tt small.live{color:var(--c)}
.chev{font-size:34px;color:var(--c);font-weight:900;line-height:1}

.cathead{display:flex;align-items:center;gap:12px}
.back{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:30px;line-height:1;font-weight:900}
.cathead .ic{width:52px;height:52px}.cathead .ic svg{width:28px;height:28px}
.cathead h1{margin:0;font-size:30px;font-weight:900}
.lbl{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 2px -6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{min-height:64px;border-radius:18px;background:var(--card);border:2px solid var(--line);font-size:20px;font-weight:800;padding:8px}
.grid .opt{font-size:22px}
.opt.big{min-height:92px;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.opt.big small{font-size:13px;font-weight:700;opacity:.75}
.opt.on{background:var(--sel);border-color:var(--sel);color:var(--sel-fg)}
.opt:disabled{opacity:.4;cursor:default}
.addnow{width:100%;min-height:78px;border-radius:22px;background:var(--c);color:var(--on);font-size:26px;font-weight:900;letter-spacing:.02em;margin-top:6px}
.addnow:disabled{opacity:.3;cursor:default}
.status{padding:14px 16px;border-radius:18px;background:var(--cs);color:var(--fg);font-size:17px}
.status b{color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips .opt{min-height:56px;padding:8px 16px;font-size:18px;display:inline-flex;align-items:center;gap:10px}
.chips .x{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--danger);color:#fff;font-size:16px}
.txt{width:100%;min-height:60px;padding:0 16px;border-radius:18px;border:2px solid var(--line);background:var(--card);font-size:19px;font-weight:700}
.txt:focus{border-color:var(--sel);outline:none}
.amtrow{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.amtrow .txt{min-height:64px;font-size:20px;font-weight:800;border-style:dashed}
.amtrow .txt:focus{border-style:solid}
.amtrow .addamt{min-height:64px;border-radius:18px;background:var(--sel);color:var(--sel-fg);font-size:20px;font-weight:900}
.tbox{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:24px;background:var(--pick-bg)}
.dayrow{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:8px}
.dayrow b{text-align:center;font-size:20px;font-weight:900}
.step{min-height:52px;border-radius:16px;background:var(--pick-band);color:var(--pick-accent);font-size:30px;font-weight:900;line-height:1}
.step:disabled{opacity:.3;cursor:default}
.wheels{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;height:180px}
.band{position:absolute;left:0;right:0;top:60px;height:60px;border-radius:18px;background:var(--pick-band);border:2px solid var(--pick-line);pointer-events:none}
.wheel{position:relative;height:180px;overflow-y:scroll;scroll-snap-type:y mandatory;padding:60px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel div{height:60px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:30px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.wheel div.on{font-size:44px;font-weight:900;color:var(--fg)}
.wheels .colon{position:relative;font-size:40px;font-weight:900;padding-bottom:6px}
.tnow{min-height:48px;border-radius:14px;border:2px solid var(--pick-line);background:transparent;color:var(--pick-accent);font-size:17px;font-weight:900}
.brandbtn{text-align:left;padding:0;border-radius:12px}
.brandbtn small::after{content:"  ›"}
.growbtn{min-height:56px;border-radius:16px;background:var(--pick-accent);color:var(--on-c);font-size:18px;font-weight:900;margin-top:6px}
.gform{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:22px;background:var(--pick-bg)}
.gfields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gfields label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:0}
.gfields .txt{min-height:58px;text-align:center;padding:0 6px;font-size:20px;font-weight:800}
.gsum{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.gsum b{font-size:20px;font-weight:900}
.gsum span{color:var(--muted);font-size:15px}
.chart{padding:12px 8px 8px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--font);font-size:11px;font-weight:700;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 8px 2px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.mrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.mrow b{font-size:16px}.mrow span{display:block;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.mdel{padding:10px 12px;border-radius:12px;border:1px solid var(--line);color:var(--danger);font-weight:800;font-size:14px}
.mdel.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.topr{display:flex;align-items:center;gap:8px;min-width:0}
.sos{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--danger);color:var(--danger);font-size:13px;font-weight:900;letter-spacing:.04em;background:var(--card)}
.pic{border-radius:14px;background:#FFFFFF;border:1px solid var(--line);padding:4px}
.pic svg{display:block;width:100%;height:auto}
.sosbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:64px;border-radius:20px;background:var(--danger);color:#fff;font-size:20px;font-weight:900;letter-spacing:.08em}
.sosbtn svg{width:26px;height:26px}
.callbtn{display:flex;align-items:center;justify-content:center;gap:12px;min-height:84px;border-radius:22px;background:var(--danger);color:#fff;font-size:28px;font-weight:900;text-decoration:none}
.callbtn.alt{min-height:60px;font-size:19px;background:var(--card);color:var(--fg);border:2px solid var(--line)}
.calls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tellbox{padding:14px 16px;border-radius:18px;background:var(--card);border:2px solid var(--danger);display:flex;flex-direction:column;gap:6px;font-size:16px}
.tellbox b{font-size:18px}
.aid{border-radius:20px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.aid summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:0 18px;font-size:20px;font-weight:900}
.aid summary::-webkit-details-marker{display:none}
.aid summary::after{content:"+";font-size:28px;color:var(--danger)}
.aid[open] summary::after{content:"−"}
.aid .body{padding:0 18px 18px;display:flex;flex-direction:column;gap:10px;font-size:17px;line-height:1.45;font-weight:700}
.aidimg{display:block;width:100%;height:auto;border-radius:14px;background:#fff}
.fingers{padding:10px 12px;border-radius:12px;border:2px solid var(--danger);color:var(--danger);font-size:16px;font-weight:900}
.aid ol,.aid ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.aid .warn{padding:10px 12px;border-radius:12px;background:var(--bg);font-size:15px;color:var(--muted)}
.backup{display:flex;flex-direction:column;gap:10px;margin-top:10px;padding:16px;border-radius:20px;background:var(--card);border:1px dashed var(--line)}
.backup b{font-size:17px}.backup span{color:var(--muted);font-size:14px}
.mbtn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:64px;padding:0 20px;border-radius:20px;background:var(--pick-bg);color:var(--fg);font-size:19px;font-weight:900}
.mbtn span{color:var(--pick-accent);font-size:15px}
.mlist{display:flex;flex-direction:column;gap:8px}
.mcard{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:left}
.mcard .star{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--pick-bg);color:var(--pick-accent);font-size:20px}
.mcard b{display:block;font-size:17px}.mcard small{display:block;color:var(--muted);font-size:13px}
.mcard i{display:block;color:var(--fg);font-style:normal;font-size:14px;margin-top:2px}
.chips .opt.done{background:var(--pick-bg);border-color:var(--pick-line);color:var(--fg)}
.napwrap{display:flex;gap:8px;align-items:stretch}
.napwrap .swipe{flex:1;min-width:0}
.swipe{position:relative;overflow:hidden;border-radius:18px}
.swipe .acts{position:absolute;top:0;bottom:0;right:0;display:flex}
.swipe .acts button{width:84px;color:#fff;font-size:16px;font-weight:900}
.swipe .act-edit{background:var(--custom)}
.swipe .act-del{background:var(--danger)}
.swipe .row{position:relative;z-index:1;touch-action:pan-y;transition:transform .2s ease-out}
.swipe.open .row{transform:translateX(-168px)}
.wake{flex:none;padding:0 16px;border-radius:18px;background:var(--nap);color:var(--on-c);font-size:16px;font-weight:900;line-height:1.15}
.opt .x{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--danger);color:#fff;font-size:15px;margin-left:6px;vertical-align:middle}
.brand small{display:block;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:0}
.more{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:52px;padding:0 18px;border-radius:16px;background:var(--sel);color:var(--sel-fg);font-size:17px;font-weight:900;letter-spacing:.02em;box-shadow:0 4px 12px rgba(30,159,85,.28)}
.more span{font-size:22px;line-height:1}
.babycard{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border-radius:22px;background:var(--card);border:1px solid var(--line)}
.babycard b{font-size:24px;font-weight:900}
.babycard span{color:var(--muted);font-size:15px}
.meters{display:flex;flex-direction:column;gap:10px}
.meter{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.meter .mh{display:flex;align-items:center;gap:12px}
.meter .ic{width:40px;height:40px}.meter .ic svg{width:22px;height:22px}
.meter .tt b{font-size:17px}.meter .tt small{font-size:13px}
.meter .val{flex:none;text-align:right;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.meter .val small{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.track{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.fill{height:100%;border-radius:999px;background:var(--c)}
.met{color:var(--sel);font-weight:900}
.fine{color:var(--muted);font-size:13px;line-height:1.5;margin:0}
.form{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.form .lbl{margin:0 2px -6px}
.link{color:var(--muted);text-decoration:underline;font-size:15px;padding:6px 2px;align-self:flex-start}

.day{display:flex;flex-direction:column;gap:8px}
.dayhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;padding:6px 2px 0}
.dayhead h2{margin:0;font-size:20px;font-weight:900}
.dayhead span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:left}
.row .ic{width:42px;height:42px}.row .ic svg{width:22px;height:22px}
.row .tt b{font-size:17px}.row .tt small{font-size:13px}
.row time{flex:none;font-size:15px;font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.empty{padding:28px 20px;border-radius:20px;background:var(--card);border:1px dashed var(--line);color:var(--muted);text-align:center}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:10px;background:var(--card);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar button{flex:1;max-width:270px;min-height:58px;border-radius:16px;font-size:17px;font-weight:900;letter-spacing:.05em;display:flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line)}
.bar button svg{width:22px;height:22px}
.bar.three button{flex-direction:column;gap:3px;min-height:58px;font-size:12px;letter-spacing:.06em;padding:4px 6px;max-width:200px;min-width:0}
.bar.three button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hub{display:flex;flex-direction:column;gap:12px}
.bar button.cur{background:var(--fg);color:var(--bg);border-color:var(--fg)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;width:min(528px,calc(100% - 32px));
  display:flex;align-items:center;gap:12px;padding:14px 14px 14px 18px;border-radius:18px;background:var(--sel);color:var(--sel-fg);font-size:17px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.18)}
#toast.err{background:var(--danger);color:#fff}
#toast span{flex:1;min-width:0}
#toast button{padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.22);font-weight:900}
#sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-bg{position:absolute;inset:0;background:rgba(5,8,15,.5)}
.sheet{position:relative;max-height:90%;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;display:flex;flex-direction:column;gap:14px;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet > *{width:100%;max-width:560px;margin-left:auto;margin-right:auto}
.sheet h2{margin:0;font-size:24px;font-weight:900}
.sheet .by{color:var(--muted);font-size:14px;margin:0}
.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.btn{min-height:60px;border-radius:18px;font-size:19px;font-weight:900;border:2px solid var(--line);background:var(--card)}
.btn.save{background:var(--sel);border-color:var(--sel);color:var(--sel-fg)}
.btn.del{color:var(--danger)}
.btn.del.armed{background:var(--danger);border-color:var(--danger);color:#fff}
input[type="datetime-local"].txt{font-size:18px}
@media (prefers-reduced-motion: no-preference){
  #toast{animation:pop .18s ease-out}
  .sheet.anim{animation:up .2s ease-out}
  @keyframes pop{from{transform:translate(-50%,10px);opacity:0}}
  @keyframes up{from{transform:translateY(30px);opacity:.4}}
}

}

  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);

/* ---------- describing entries ---------- */
const activeNap=()=>store.events.find(e=>e.cat==='nap'&&!e.end);
function title(e){
  if(e.cat==='feeding')return (FEED[e.type]||'Feeding')+(e.ml?' · '+e.ml+' ml':'');
  if(e.cat==='diaper')return 'Diaper · '+(DIAPER[e.kind]||'')+(DSIZE[e.size]?' · '+DSIZE[e.size]:'');
  if(e.cat==='nap')return e.end?sleepKind(e)+' · '+dur((e.end-e.at)/60000):'Sleeping · '+dur((Date.now()-e.at)/60000)+' so far';
  if(e.cat==='pump')return 'Pumped'+(e.ml?' '+e.ml+' ml':'')+(PUMP[e.side]?' · '+PUMP[e.side]:'');
  return e.label||'Custom';
}
/* ---------- next-sleep hint ----------
   Starts from typical awake times for her age (pediatric sleep guidance; rules of thumb, not precise science)
   and shifts toward her own recent pattern as more sleeps are logged. */
const WAKE=[[28,35,60],[84,60,90],[120,75,120],[210,120,180],[300,150,210],[420,180,240],[99999,240,330]];
function wakePrior(days){for(const w of WAKE)if(days<w[0])return {lo:w[1],hi:w[2]};return {lo:240,hi:330}}
function quant(a,q){const b=a.slice().sort((x,y)=>x-y),i=(b.length-1)*q,l=Math.floor(i);return b[l]+(b[Math.min(l+1,b.length-1)]-b[l])*(i-l)}
function nextSleep(){
  const b=store.baby,d=b?ageDays(b.born):null;if(d==null||d<0)return null;
  if(activeNap())return null;
  const naps=store.events.filter(e=>e.cat==='nap'&&e.end).sort((x,y)=>x.at-y.at);
  const last=naps[naps.length-1];if(!last)return null;
  const prior=wakePrior(d),week=Date.now()-7*864e5,gaps=[];
  for(let i=0;i<naps.length-1;i++){
    if(naps[i].end<week)continue;
    const g=(naps[i+1].at-naps[i].end)/60000;
    // very short gaps are usually a quick wake-and-resettle; very long ones usually a missed log
    if(g>=prior.lo*0.6&&g<=prior.hi*2.5)gaps.push(g);
  }
  const w=Math.min(1,gaps.length/10);                     // 10+ recent gaps: mostly her own pattern
  // centre on her typical (median) awake time, keep the window as wide as the age range
  const mid=gaps.length>=3?(1-w)*(prior.lo+prior.hi)/2+w*quant(gaps,.5):(prior.lo+prior.hi)/2;
  const half=Math.max(10,(prior.hi-prior.lo)/2);
  const lo=Math.max(prior.lo*0.6,mid-half),hi=mid+half;
  const awake=(Date.now()-last.end)/60000;
  return {awake,from:last.end+lo*60000,to:last.end+hi*60000,n:gaps.length,own:gaps.length>=3,late:awake>hi};
}
function napHint(){
  const ns=nextSleep(),b=store.baby||{};
  if(!ns||ns.awake>=12*60)return 'Baby is awake';
  return 'Awake for <b>'+dur(ns.awake)+'</b>'+(ns.late?' · past her usual awake time, watch for tired signs':' · next sleep likely <b>'+clock(ns.from)+'–'+clock(ns.to)+'</b>')+
    '<br><small style="color:var(--muted);font-weight:700">Based on '+(ns.own?esc(b.name||'her')+'’s last '+ns.n+' awake '+(ns.n===1?'stretch':'stretches')+' and typical times for her age':'typical awake times for her age (log more sleeps to personalise)')+'. Yawning, rubbing eyes or staring away are the best signs.</small>';
}
function lastLine(c){
  if(c==='custom')return null;
  if(c==='nap'){
    const a=activeNap(); if(a)return {t:'Sleeping now · '+dur((Date.now()-a.at)/60000),live:true};
    const ns=nextSleep();
    if(ns&&ns.awake<12*60)return {t:'Awake '+dur(ns.awake)+' · '+(ns.late?'may be getting tired':'next sleep ~'+clock(ns.from)+'–'+clock(ns.to)),live:ns.late};
    const n=store.events.find(e=>e.cat==='nap'); if(n)return {t:'Woke '+ago(n.end)+' · slept '+dur((n.end-n.at)/60000)};
    return {t:'Tap when baby falls asleep'};
  }
  const e=store.events.find(x=>x.cat===c);
  if(!e)return {t:store.mode==='connecting'?'Loading…':'Nothing logged yet'};
  return {t:ago(e.at)+' · '+(c==='diaper'?(DIAPER[e.kind]||'')+(DSIZE[e.size]?' · '+DSIZE[e.size]:''):title(e))};
}

const WH=60;
function timeBox(key,ms,label,withSave){
  const d=new Date(ms),t=new Date(),isToday=d.toDateString()===t.toDateString();
  const items=(n,cur)=>Array.from({length:n},(_,i)=>'<div'+(i===cur?' class="on"':'')+'>'+String(i).padStart(2,'0')+'</div>').join('');

    '<div class="dayrow">'+b(-1,'‹')+'<b>'+dayLabel(ms)+'</b>'+b(1,'›',isToday)+'</div>'+
    '<div class="wheels"><div class="band"></div>'+
      '<div class="wheel" data-key="'+key+'" data-f="h" aria-label="Hour">'+items(24,d.getHours())+'</div><div class="colon">:</div>'+

function setupWheels(){
  sheetEl.querySelectorAll('.wheel').forEach(w=>{
    const key=w.dataset.key,f=w.dataset.f,cells=w.children;
    const val=()=>{const x=new Date(S.edit.draft[key]);return f==='h'?x.getHours():x.getMinutes()};
    w.scrollTop=val()*WH;
    let tmr=null;
    w.addEventListener('scroll',()=>{
      const i=Math.max(0,Math.min(cells.length-1,Math.round(w.scrollTop/WH)));
      for(let k=0;k<cells.length;k++)cells[k].classList.toggle('on',k===i);
      clearTimeout(tmr);tmr=setTimeout(()=>{
        if(!S.edit||i===val())return;   // the wheel only settled where it already was: nothing changed
        const x=new Date(S.edit.draft[key]);
        if(f==='h')x.setHours(i);else x.setMinutes(i);
        S.edit.draft[key]=x.getTime();
        if(S.edit.confirm){S.edit.confirm=false;const d=sheetEl.querySelector('[data-a="del"]');if(d){d.classList.remove('armed');d.textContent='Delete'}}
      },120);
    },{passive:true});
    // tap a number to jump to it
    w.addEventListener('click',e=>{const c=e.target.closest('.wheel > div');if(c)w.scrollTo({top:[].indexOf.call(cells,c)*WH,behavior:'smooth'})});
  });
}

function tzCountry(){
  try{const z=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
    if(TZ[z])return TZ[z];
    if(/^America\/(New_York|Chicago|Denver|Los_Angeles|Phoenix|Anchorage|Detroit)$/.test(z)||z==='Pacific/Honolulu')return 'US';
    return z?'?':null;
  }catch(e){return null}

/* Where the phone is now (time zone, which phones update automatically when travelling). */
/* ---------- location (asked only when someone taps the button; reusable for later features) ---------- */
function loadLoc(){try{return JSON.parse(localStorage.getItem('bl.loc')||'null')}catch(e){return null}}
function getPosition(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej(new Error('unsupported'));navigator.geolocation.getCurrentPosition(p=>res(p.coords),rej,{enableHighAccuracy:true,timeout:15000,maximumAge:120000})})}
async function locateCountry(){
  const c=await getPosition();
  /* rounded to about 1 km before asking which area that is; the exact position stays on this phone */
  const lat=c.latitude.toFixed(2),lon=c.longitude.toFixed(2);
  const r=await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lat+'&longitude='+lon+'&localityLanguage=en');
  if(!r.ok)throw new Error('lookup');
  const j=await r.json();if(!j.countryCode)throw new Error('lookup');
  const place=[j.locality,j.city,j.principalSubdivision].filter((x,i,a)=>x&&a.indexOf(x)===i).slice(0,2).join(', ');
  const loc={code:String(j.countryCode).toUpperCase(),name:j.countryName||j.countryCode,place,lat:+c.latitude.toFixed(5),lon:+c.longitude.toFixed(5),acc:Math.round(c.accuracy||0),at:Date.now()};
  try{localStorage.setItem('bl.loc',JSON.stringify(loc))}catch(e){}
  return loc;
}
/* Refresh quietly if this phone already allowed location before. */
async function refreshLocQuietly(){
  try{const st=await navigator.permissions.query({name:'geolocation'});if(st.state!=='granted')return;
    const old=loadLoc();if(old&&Date.now()-old.at<5*60000)return;
    await locateCountry();if(S.view==='sos')render();
  }catch(e){}
}
function hereRegion(){
  const L=loadLoc();
  if(L&&Date.now()-L.at<12*3600000){
    if(REGIONS[L.code])return Object.assign({code:L.code,src:'location'},REGIONS[L.code]);
    return {code:L.code,name:L.name,number:'112',src:'location',unknown:true};
  }
  const c=tzCountry();return c&&c!=='?'?Object.assign({code:c,src:'time zone'},REGIONS[c]):null;
}
/* First-time suggestion: where the phone is, else the phone's language region. */
function langRegion(){try{for(const l of (navigator.languages||[navigator.language])){const m=/-([A-Z]{2})$/i.exec(l||'');if(m&&REGIONS[m[1].toUpperCase()])return Object.assign({code:m[1].toUpperCase()},REGIONS[m[1].toUpperCase()])}}catch(e){}return null}
function detectRegion(){
  const h=hereRegion();if(h)return h;
  if(tzCountry()==='?')return null;
  try{for(const l of (navigator.languages||[navigator.language])){const m=/-([A-Z]{2})$/i.exec(l||'');if(m&&REGIONS[m[1].toUpperCase()])return Object.assign({code:m[1].toUpperCase()},REGIONS[m[1].toUpperCase()])}}catch(e){}
  return null;
}
function ordinal(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}

function growthChart(met,pts,ageNow){

  const ages=[];for(let a=0;a<=x1;a+=Math.max(1,Math.round(x1/60)))ages.push(a);if(ages[ages.length-1]!==x1)ages.push(x1);
  const P=z=>ages.map(a=>valAt(z,lms(met,a)));
  const lo=P(-1.881),hi=P(1.881),l15=P(-1.036),h85=P(1.036),med=P(0);
  let yMin=Math.min(...lo,...pts.map(p=>p.v)),yMax=Math.max(...hi,...pts.map(p=>p.v));
  const step=met==='kg'?(yMax-yMin>6?2:1):(yMax-yMin>20?5:2);
  yMin=Math.floor(yMin/step)*step;yMax=Math.ceil(yMax/step)*step;
  const X=a=>l+(a/x1)*(W-l-r),Y=v=>t+(1-(v-yMin)/(yMax-yMin))*(H-t-bt);
  const line=arr=>arr.map((v,i)=>(i?'L':'M')+X(ages[i]).toFixed(1)+' '+Y(v).toFixed(1)).join('');
  const area=(a,b)=>line(a)+b.map((v,i)=>'L'+X(ages[b.length-1-i]).toFixed(1)+' '+Y(b[b.length-1-i]).toFixed(1)).join('')+'Z';
  let g='';
  for(let v=yMin;v<=yMax+1e-9;v+=step)g+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(l-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+String(v).replace('.',',')+'</text>';
  const months=x1>120,tick=months?(x1>400?91.3125:30.4375):14;
  for(let a=0;a<=x1+1;a+=tick)g+='<line x1="'+X(a)+'" x2="'+X(a)+'" y1="'+(H-bt)+'" y2="'+(H-bt+4)+'" stroke="var(--muted)"/><text x="'+X(a)+'" y="'+(H-bt+17)+'" text-anchor="middle">'+(months?Math.round(a/30.4375)+'m':Math.round(a/7)+'w')+'</text>';
  g+='<text x="'+((l+W-r)/2)+'" y="'+(H-4)+'" text-anchor="middle">Age ('+(months?'months':'weeks')+')</text>';
  g+='<path d="'+area(lo,hi)+'" fill="var(--band-out)"/><path d="'+area(l15,h85)+'" fill="var(--band-in)"/>';
  g+='<path d="'+line(med)+'" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="6 5"/>';
  g+='<line x1="'+X(ageNow)+'" x2="'+X(ageNow)+'" y1="'+t+'" y2="'+(H-bt)+'" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 3"/><text x="'+(X(ageNow)+4)+'" y="'+(t+10)+'">today</text>';
  if(pts.length){
    const lp=pts[pts.length-1],z=zOf(lp.v,lms(met,lp.age)),pa=[];
    for(let a=lp.age;a<=x1;a+=Math.max(1,Math.round(x1/60)))pa.push(a);if(pa[pa.length-1]!==x1)pa.push(x1);
    g+='<path d="'+pa.map((a,i)=>(i?'L':'M')+X(a).toFixed(1)+' '+Y(valAt(z,lms(met,a))).toFixed(1)).join('')+'" fill="none" stroke="var(--pick-accent)" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round" opacity=".85"/>';
    if(pts.length>1)g+='<path d="'+pts.map((p,i)=>(i?'L':'M')+X(p.age).toFixed(1)+' '+Y(p.v).toFixed(1)).join('')+'" fill="none" stroke="var(--pick-accent)" stroke-width="2.5" stroke-linejoin="round"/>';
    pts.forEach(p=>{g+='<circle cx="'+X(p.age)+'" cy="'+Y(p.v)+'" r="'+(S.gPick===p.id?7:5)+'" fill="var(--pick-accent)" stroke="var(--card)" stroke-width="2"/><circle cx="'+X(p.age)+'" cy="'+Y(p.v)+'" r="16" fill="transparent" data-a="gpick" data-v="'+esc(p.id)+'" style="cursor:pointer"/>'});
  }
  const empty=pts.length?'':'<text x="'+((l+W-r)/2)+'" y="'+(t+40)+'" text-anchor="middle" style="font-size:13px">Add a measurement above to see her curve</text>';
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+GM[met].name+' chart">'+g+empty+'</svg>'+
    '<div class="legend"><span><i style="background:var(--pick-accent)"></i>Violetta</span><span><i style="background:none;border-top:2px dashed var(--muted);height:0;border-radius:0"></i>Average</span><span><i style="background:var(--band-in)"></i>15th–85th</span><span><i style="background:var(--band-out);border:1px solid var(--line)"></i>3rd–97th</span><span><i style="background:none;border-top:2px dotted var(--pick-accent);height:0;border-radius:0"></i>Projection</span></div></div>';
}

function pressStart(tile,y){lp={tile,y0:y,dragging:false};lp.timer=setTimeout(()=>{
  const tiles=[...document.querySelectorAll('.tiles .tile')];
  lp.tiles=tiles;lp.rects=tiles.map(t=>t.getBoundingClientRect());lp.from=tiles.indexOf(tile);lp.to=lp.from;
  lp.step=tiles.length>1?lp.rects[1].top-lp.rects[0].top:0;lp.dragging=true;tile.classList.add('lifting');

  lp.tile.style.transform='translateY('+dy+'px)';
  const r=lp.rects[lp.from],c=r.top+r.height/2+dy;
  let to=lp.rects.findIndex(x=>c<x.top+x.height);if(to<0)to=lp.rects.length-1;lp.to=to;
  lp.tiles.forEach((t,i)=>{if(i===lp.from)return;let sh=0;
    if(lp.from<to&&i>lp.from&&i<=to)sh=-lp.step;if(lp.from>to&&i>=to&&i<lp.from)sh=lp.step;
    t.style.transform=sh?'translateY('+sh+'px)':''});
}
function pressEnd(){
  if(!lp)return;clearTimeout(lp.timer);const d=lp;lp=null;if(!d.dragging)return;
  const o=d.tiles.map(t=>t.dataset.cat),[m]=o.splice(d.from,1);o.splice(d.to,0,m);
  lsSet('bl.order',JSON.stringify(o));lsSet('bl.orderTip','1');
  swallowClick=true;setTimeout(()=>{swallowClick=false},120);S.pending=false;render();
}
document.addEventListener('touchstart',e=>{lastTouch=Date.now();const t=e.target.closest('.tiles .tile');if(t&&e.touches.length===1)pressStart(t,e.touches[0].clientY)},{passive:true});
document.addEventListener('touchmove',e=>{if(!lp)return;if(lp.dragging)e.preventDefault();pressMove(e.touches[0].clientY)},{passive:false});
document.addEventListener('touchend',pressEnd);document.addEventListener('touchcancel',pressEnd);
document.addEventListener('mousedown',e=>{if(Date.now()-lastTouch<800||e.button!==0)return;const t=e.target.closest('.tiles .tile');if(t)pressStart(t,e.clientY)});
document.addEventListener('mousemove',e=>{if(lp&&Date.now()-lastTouch>800)pressMove(e.clientY)});
document.addEventListener('mouseup',()=>{if(Date.now()-lastTouch>800)pressEnd()});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.tiles .tile'))e.preventDefault()});

/* ---------- swipe a log entry left to show Edit / Delete ---------- */
const SW=168;let sw=null,swallowClick=false;
function closeSwipes(except){document.querySelectorAll('.swipe.open').forEach(x=>{if(x!==except)x.classList.remove('open')});if(!except)S.swipeOpen=null}
document.addEventListener('pointerdown',e=>{
  const row=e.target.closest('.swipe > .row');
  if(!row){if(!e.target.closest('.swipe .acts'))closeSwipes();return}
  const el=row.parentNode;sw={el,row,x:e.clientX,y:e.clientY,base:el.classList.contains('open')?-SW:0,drag:false,dx:0};
});
document.addEventListener('pointermove',e=>{
  if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(!sw.drag){
    if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.2){sw.drag=true;sw.row.style.transition='none';closeSwipes(sw.el)}
    else if(Math.abs(dy)>10){sw=null;return}
  }
  if(sw.drag){sw.dx=dx;sw.row.style.transform='translateX('+Math.max(-SW-20,Math.min(0,sw.base+dx))+'px)'}
});
function endSwipe(){
  if(!sw)return;const s=sw;sw=null;if(!s.drag)return;
  const open=s.base+s.dx<-SW/2.5;
  s.row.style.transition='';s.row.style.transform='';
  s.el.classList.toggle('open',open);S.swipeOpen=open?s.el.dataset.id:null;
  swallowClick=true;setTimeout(()=>{swallowClick=false},80);
}
document.addEventListener('pointerup',endSwipe);document.addEventListener('pointercancel',endSwipe);
document.addEventListener('click',e=>{
  if(swallowClick){e.preventDefault();e.stopPropagation();return}
  const row=e.target.closest('.swipe.open > .row');           // tapping an opened row just closes it
  if(row){e.preventDefault();e.stopPropagation();closeSwipes()}
},true);
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const f=ACT[b.dataset.a];if(f)f(b.dataset.v,b);
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.classList&&d.classList.contains('aid')){S.sosOpen=S.sosOpen||{};S.sosOpen[d.dataset.k]=d.open}},true);
document.addEventListener('input',e=>{
  if(e.target.id==='amt-in'){S.newAmt=e.target.value.replace(/[^0-9]/g,'')}
  if(e.target.id==='new-label'){S.newLabel=e.target.value;const b=document.getElementById('add-custom');if(b)b.disabled=!S.newLabel.trim()}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='who-name')ACT.pickNew();
  if(e.target.id==='amt-in'&&S.newAmt){e.target.blur();ACT.addAmt()}
  if(e.target.id==='new-label'&&S.newLabel.trim())ACT.add();
});
setInterval(()=>{if(S.view==='home'||S.view==='nap'||S.view==='log'||S.view==='goals')changed()},30000);

async function startFirebase(){
  const V='10.12.2';
  const A=await import('https://www.gstatic.com/firebasejs/'+V+'/firebase-app.js');
  const F=await import('https://www.gstatic.com/firebasejs/'+V+'/firebase-firestore.js');
  const app=A.initializeApp(FIREBASE_CONFIG);
  let fs;
  try{fs=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}
  catch(e){fs=F.getFirestore(app)}
  const base='families/'+FAMILY;
  const col=F.collection(fs,base+'/events');
  const report=e=>{console.error(e);toast('Couldn’t save. Check your internet connection.',null,true)};
  // Writes show up instantly from the phone's own copy and sync in the background, so the app never waits on the network.
  const bg=p=>{p.catch(report);return Promise.resolve()};
  store.mode='shared';
  store.api={
    newId:()=>F.doc(col).id,
    set:(id,ev)=>bg(F.setDoc(F.doc(col,id),ev)),
    update:(id,p)=>bg(F.updateDoc(F.doc(col,id),p)),
    remove:(id)=>bg(F.deleteDoc(F.doc(col,id))),
    setMeta:(n,v)=>bg(F.setDoc(F.doc(fs,base+'/meta/'+n),v)),
    gset:(id,v)=>bg(F.setDoc(F.doc(fs,base+'/growth/'+id),v)),
    gdel:(id)=>bg(F.deleteDoc(F.doc(fs,base+'/growth/'+id)))
  };
  const timer=setTimeout(()=>{store.stale=true;changed()},10000);
  F.onSnapshot(F.query(col,F.orderBy('at','desc'),F.limit(2000)),{includeMetadataChanges:true},s=>{
    store.events=s.docs.map(d=>Object.assign({id:d.id},d.data()));
    if(!s.metadata.fromCache){clearTimeout(timer);store.stale=false;autoBackup()}
    changed();
  },e=>{console.error(e);clearTimeout(timer);store.error=e.code||'error';changed()});
  const meta=(n,fn)=>F.onSnapshot(F.doc(fs,base+'/meta/'+n),s=>{fn(s.exists()?s.data():null);changed()},e=>console.error(e));
  meta('people',d=>{store.people=(d&&d.names)||[]});
  meta('custom',d=>{store.labels=(d&&d.labels)||[]});
  meta('amounts',d=>{store.amounts=(d&&d.ml)||[]});
  meta('pumpamounts',d=>{store.pumpAmounts=(d&&d.ml)||[]});
  meta('sos',d=>{store.sos=d||{}});
  meta('moments',d=>{store.moments=(d&&d.items)||[]});
  meta('baby',d=>{store.baby=d});
  F.onSnapshot(F.collection(fs,base+'/growth'),s=>{store.growth=s.docs.map(d=>Object.assign({id:d.id},d.data()));changed()},e=>console.error(e));
}

/* Load the newest version right away: if the website has a newer version than this saved copy, switch to it. */
const VERSION='35';
async function checkUpdate(){
  try{
    const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const v=(await r.json()).v;
    if(v&&v!==VERSION){const q=new URLSearchParams(location.search);if(q.get('v')===v)return;q.set('v',v);if(FAMILY)q.set('f',FAMILY);location.replace(location.pathname+'?'+q.toString())}
  }catch(e){}
}
checkUpdate();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});

render();
(async()=>{
  if(FIREBASE_CONFIG&&FAMILY){try{await startFirebase();return}catch(e){console.error(e)}}
  startLocal();
})();
})();
