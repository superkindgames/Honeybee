# Sets up TestFlight testers (Actions -> "TestFlight testers" -> Run workflow).
# Input format: email|First Last, email|First Last   (emails are hidden in the logs)
name: TestFlight testers
on:
  workflow_dispatch:
    inputs:
      testers:
        description: "email|First Last, separated by commas"
        required: true
jobs:
  testers:
    runs-on: ubuntu-latest
    steps:
      - name: Hide emails in the log
        run: |
          # read the input from the event file (never from an env setting, which GitHub prints in the log)
          jq -r '.inputs.testers' "$GITHUB_EVENT_PATH" | tr ',' '\n' | while IFS='|' read -r e _; do e="$(echo "$e" | xargs)"; [ -n "$e" ] && echo "::add-mask::$e"; done
      - uses: actions/checkout@v4
      - run: pip install --quiet "pyjwt[crypto]" requests
      - name: Add testers
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 .github/scripts/testers.py
